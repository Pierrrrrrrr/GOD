[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmco-god"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
god-awaken = "tmco.web:main"
god-owner-control = "tmco.owner_control:main"
god-ontogeny = "tmco.ontogeny_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
